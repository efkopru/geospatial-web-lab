# Dependabot security updates are enabled in the repository settings. Without this file they
# arrive as one pull request for each gem in each backend: the Rails 8.1.4.1 release opened 30.
# The groups below ask for one pull request per ecosystem instead, covering every listed folder,
# so the five backend lockfiles move together.
#
# "open-pull-requests-limit: 0" turns off routine version updates for gems and npm packages;
# security updates are not affected by it. Remove that line to receive routine updates as well.
#
# Container base images are not listed. They use tags that follow patch releases
# (ruby:3.4-slim-trixie, node:24-alpine, nginx:1.30-alpine), so a rebuild picks up fixes, and a
# newer Ruby, Node or nginx series is a deliberate change.
version: 2
updates:
  - package-ecosystem: bundler
    directories:
      - /01-service-requests/backend
      - /02-data-quality-portal/backend
      - /03-fleet-monitor/backend
      - /04-parcel-scenarios/backend
      - /05-infrastructure-inspections/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  # The root folder is an npm workspace: its lockfile covers shared/ and the five frontends.
  - package-ecosystem: npm
    directories:
      - /
      - /standalone
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  # Workflows pin each action to a commit, so nothing moves them unless Dependabot does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
