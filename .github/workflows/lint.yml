name: Lint and scan

# Static checks for every change, including standalone-only changes: ESLint over the full-stack
# and standalone JavaScript, a check that copied files are still identical, and Brakeman over
# each Rails backend.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Check that copied files are still identical
        run: node --test tests/shared-copies.node.mjs

  brakeman:
    name: Brakeman
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
      - name: Install Brakeman
        run: gem install brakeman --version 8.1.0 --no-document
      # All checks run, including the end-of-life Ruby check against the Ruby the lockfiles record.
      - name: Scan each Rails backend
        run: |
          status=0
          for backend in 0*/backend; do
            echo "::group::$backend"
            brakeman --no-pager --quiet "$backend" || status=1
            echo "::endgroup::"
          done
          exit "$status"
