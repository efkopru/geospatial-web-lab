server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 12m;

 # Inherited by every location below that does not set add_header itself; cache lifetimes use
 # expires so they do not replace these headers.
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

 gzip on;
 gzip_vary on;
 gzip_proxied any;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain application/wasm;

 location / { try_files $uri $uri/ /index.html; }
 # The page itself is revalidated so a new deployment is picked up immediately.
 location = /index.html { expires -1; }
 # Vite puts a content hash in every file name under /assets, so they never change.
 location /assets/ { expires 1y; try_files $uri =404; }
 location /api/ {
  proxy_pass http://api:3000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location /cable {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
 }
 location /up { proxy_pass http://api:3000; proxy_set_header Host $http_host; }
}
