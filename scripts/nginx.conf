server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 12m;

 # Inherited by every location below that does not set add_header itself; cache lifetimes use
 # expires so they do not replace these headers.
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 # Scripts, styles and workers come only from this site, except that ArcGIS starts workers from
 # blob: URLs and both map libraries compile WebAssembly. Map data comes from the ArcGIS hosts and
 # fonts from Google Fonts. 'unsafe-inline' covers style attributes and elements the map libraries
 # set; scripts never run inline or through eval. The standalone edition carries the same policy
 # (standalone/scripts/content-security-policy.mjs), and tests/shared-copies.node.mjs compares them.
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://js.arcgis.com https://static.arcgis.com https://services.arcgisonline.com https://server.arcgisonline.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

 gzip on;
 gzip_vary on;
 gzip_proxied any;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain application/wasm;

 location / { try_files $uri $uri/ /index.html; }
 # The page itself is revalidated so a new deployment is picked up immediately.
 location = /index.html { expires -1; }
 # Vite puts a content hash in every file name under /assets, so they never change.
 location /assets/ { expires 1y; try_files $uri =404; }
 location /api/ {
  proxy_pass http://api:3000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location /cable {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
 }
 location /up { proxy_pass http://api:3000; proxy_set_header Host $http_host; }
}
