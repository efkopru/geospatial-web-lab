name: geolab-parcel-scenarios
# Every service keeps at most 50 MB of container logs and cannot gain privileges after it starts.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}
x-security-opt: &no-new-privileges ["no-new-privileges:true"]
services:
  db:
    logging: *logging
    security_opt: *no-new-privileges
    restart: unless-stopped
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: geolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/configure-env.mjs}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Generate .env with scripts/configure-env.mjs}
      POSTGRES_DB: parcel_scenarios
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "../scripts/init-database.sh:/docker-entrypoint-initdb.d/20-geolab.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolab -d parcel_scenarios"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    logging: *logging
    security_opt: *no-new-privileges
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    logging: *logging
    security_opt: *no-new-privileges
    cap_drop: [ALL]
    build: ./backend
    environment: &app-env
      DATABASE_URL: postgres://geolab_app@db:5432/parcel_scenarios
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?Generate .env with scripts/configure-env.mjs}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      FORCE_SSL: ${FORCE_SSL:-false}
    command: ["sh", "-c", "bundle exec rails runner 'ActiveRecord::Base.connection_pool.schema_migration.create_table' && bundle exec rails db:migrate"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    logging: *logging
    security_opt: *no-new-privileges
    cap_drop: [ALL]
    stop_grace_period: 30s
    restart: unless-stopped
    build: ./backend
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    logging: *logging
    security_opt: *no-new-privileges
    cap_drop: [ALL]
    stop_grace_period: 40s
    restart: unless-stopped
    build: ./backend
    environment: *app-env
    command: ["bundle", "exec", "sidekiq", "-c", "3"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    logging: *logging
    security_opt: *no-new-privileges
    # nginx starts as root to bind port 80 and own its cache folders, then serves as the nginx user.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: scripts/Frontend.Dockerfile
      args:
        PROJECT: 04-parcel-scenarios
        DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-true}
    ports: ["127.0.0.1:5174:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  db-data:
  redis-data:
